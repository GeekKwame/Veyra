version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veyra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: veyra_db
      POSTGRES_USER: veyra_user
      POSTGRES_PASSWORD: veyra_password
    ports:
      - "5432:5432"
    volumes:
      - veyra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra_user -d veyra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veyra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - veyra_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  veyra_pgdata:
  veyra_redisdata:
